[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console", "Event", "EventTarget", "HtmlCanvasElement", "HtmlImageElement", "HtmlVideoElement", "ImageBitmap", "ImageData", "OffscreenCanvas", "WebGl2RenderingContext", "WebGlContextAttributes", "WebGlPowerPreference", "WebGlProgram"] }

# the tests in browsers: `cargo test --target wasm32-unknown-unknown --no-default-features
# --features webgl`, run by `wasm-bindgen-test-runner` (see `.cargo/config.toml`)
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "Document", "Element", "HtmlCanvasElement", "ImageData", "WebGl2RenderingContext", "WebGlContextAttributes", "WebglLoseContext", "Window"] }

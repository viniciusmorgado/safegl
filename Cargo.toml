[package]
name = "safegl"
version = "0.2.0"
authors = ["Vinicius Donatto Morgado <34577818+viniciusmorgado@users.noreply.github.com>"]
description = "Safe OpenGL bindings for Rust."
keywords = ["opengl", "gamedev"]
categories = ["api-bindings", "rendering::graphics-api"]
documentation = "https://docs.rs/safegl"
repository = "https://github.com/viniciusmorgado/safegl"
readme = "README.md"
license = "Apache-2.0"
build = "build/main.rs"
exclude = ["doc", ".idea", "examples/renderers", "examples/standalone/support/fern_02"]
edition = "2021"

[features]
default = ["backtrace", "glutin_backend", "egl", "simple_window_builder", "glutin/default", "winit/rwh_06", "winit/x11", "winit/wayland", "winit/wayland-dlopen", "winit/wayland-csd-adwaita-notitle", "glutin-winit/default"]
# OpenGL levels. Select at most one desktop level and one OpenGL ES level, or `webgl` alone for
# browsers; without any, the level is `gl40`. A level is a ceiling: the API of the versions above
# it doesn't compile.
gl40 = [] # desktop OpenGL 4.0 core
gl41 = [] # desktop OpenGL 4.1 core, the macOS ceiling
gl42 = [] # desktop OpenGL 4.2 core
gl43 = [] # desktop OpenGL 4.3 core
gl44 = [] # desktop OpenGL 4.4 core
gl45 = [] # desktop OpenGL 4.5 core
gl46 = [] # desktop OpenGL 4.6 core
gles30 = [] # OpenGL ES 3.0
gles31 = [] # OpenGL ES 3.1
gles32 = [] # OpenGL ES 3.2
webgl = ["dep:web-sys", "dep:wasm-bindgen", "dep:js-sys"] # WebGL 2 in browsers (wasm32), the OpenGL ES 3.0 set
glutin_backend = ["glutin"]
egl = ["glutin_backend", "glutin/egl"] # displays without window, and surfaces removed from displays
backtrace = ["dep:backtrace"] # prints a backtrace with the OpenGL debug messages reported as errors
unstable = [] # used for benchmarks
simple_window_builder = ["glutin", "glutin-winit", "winit", "raw-window-handle"] # used in the tutorial

[dependencies.glutin]
version = "0.32.3"
features = []
optional = true
default-features = false

[dependencies.glutin-winit]
version = "0.5.0"
features = []
optional = true
default-features = false

[dependencies.winit]
version = "0.30"
features = []
optional = true
default-features = false

[dependencies.raw-window-handle]
version = "0.6.2"
features = []
optional = true
default-features = false

[dependencies]
memoffset = "0.9.1"
backtrace = { version = "0.3.76", optional = true }
smallvec = "1.16.4"
fnv = "1.0.7"
glow = "0.18"

# the tests and examples run natively, and the tests also run in browsers (see below)
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
ouroboros = "0.18.5"
nalgebra = "0.35.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
obj = "0.10.2"
rand = "0.10.3"
libc = "0.2.191"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
raw-window-handle = "0.6.2"
glutin-winit = "0.5.0"
takeable-option = "0.5.0"
gltf = { version = "1.4.1", default-features = false, features = ["utils"] }

# the kiosk example draws with DRM/KMS and GBM, without window system, loading libgbm
[target.'cfg(target_os = "linux")'.dev-dependencies]
drm = "0.14"
libloading = "0.8"
# the tests of memory objects share memory and semaphores with Vulkan
ash = "0.38"

# the Android example runs in a native activity
[target.'cfg(target_os = "android")'.dev-dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "android-native-activity"] }

[package.metadata.docs.rs]
features = ["gl46", "gles32", "backtrace", "glutin_backend", "egl", "simple_window_builder", "glutin/default", "winit/rwh_06", "winit/x11", "winit/wayland", "glutin-winit/default"]
rustdoc-args = ["--cfg", "docsrs"]


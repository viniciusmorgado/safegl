[package]
name = "safegl"
version = "0.1.0"
authors = ["Vinicius Donatto Morgado <34577818+viniciusmorgado@users.noreply.github.com>"]
description = "Safe OpenGL bindings for Rust."
keywords = ["opengl", "gamedev"]
categories = ["api-bindings", "rendering::graphics-api"]
documentation = "https://docs.rs/safegl"
repository = "https://github.com/viniciusmorgado/safegl"
readme = "README.md"
license = "Apache-2.0"
build = "build/main.rs"
exclude = ["doc", ".idea", "examples/renderers", "examples/standalone/support/fern_02"]
edition = "2021"

[features]
default = ["gl46", "glutin_backend", "simple_window_builder", "glutin/default", "winit/rwh_06", "winit/x11", "winit/wayland", "winit/wayland-dlopen", "winit/wayland-csd-adwaita-notitle", "glutin-winit/default"]
# OpenGL feature tiers. Each tier includes the ones below it.
gles30 = [] # common subset of OpenGL ES 3.0 and desktop OpenGL 4.1
gl41 = ["gles30"] # desktop OpenGL 4.1 core, the macOS ceiling
gl46 = ["gl41"] # desktop OpenGL 4.6 core, not available on macOS
webgl = ["gles30", "dep:web-sys", "dep:wasm-bindgen"] # WebGL 2 in browsers (wasm32), the gles30 tier
glutin_backend = ["glutin"]
unstable = [] # used for benchmarks
simple_window_builder = ["glutin", "glutin-winit", "winit", "raw-window-handle"] # used in the tutorial

[dependencies.glutin]
version = "0.32.3"
features = []
optional = true
default-features = false

[dependencies.glutin-winit]
version = "0.5.0"
features = []
optional = true
default-features = false

[dependencies.winit]
version = "0.30"
features = []
optional = true
default-features = false

[dependencies.raw-window-handle]
version = "0.6.2"
features = []
optional = true
default-features = false

[dependencies]
memoffset = "0.9.1"
backtrace = "0.3.76"
smallvec = "1.16.4"
fnv = "1.0.7"
glow = "0.18"

[dev-dependencies]
ouroboros = "0.18.5"
nalgebra = "0.35.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
obj = "0.10.2"
rand = "0.10.3"
libc = "0.2.191"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
raw-window-handle = "0.6.2"
glutin-winit = "0.5.0"
takeable-option = "0.5.0"
gltf = { version = "1.4.1", default-features = false, features = ["utils"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


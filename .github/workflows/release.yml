name: Release to crates.io

# Publish SafeGL at the version prepared by the pull request to main, then tag it.
# A direct push to main can prepare its version here using the same commit rules.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

# The job commits the version bump and pushes the tag; the default token is
# read-only in a new repository.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ANCHOR_CRATE: safegl

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test library and compile graphical tests
        run: |
          cargo test --lib
          cargo test --all --all-targets --no-run

      # The version to release is the one in Cargo.toml. If it is already published (a push
      # to main that skipped the PR flow), bump it here from the commits since the last "v*"
      # tag — "BREAKING CHANGE:" -> major, "feat:" -> minor, anything else -> patch — and
      # commit it, so Cargo.toml stays the source of truth.
      # A merge that changes only workflows, documentation or examples has
      # nothing to release: the library would be identical to the version already
      # on crates.io. Library sources, build scripts and the package manifest
      # decide whether a new version is needed.
      - name: Is there anything to release?
        id: guard
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            echo "No release tag yet: releasing."
            exit 0
          fi
          CHANGED=$(git diff --name-only "$LAST_TAG..HEAD" -- \
            src build Cargo.toml)
          if [ -z "$CHANGED" ]; then
            echo "Nothing that goes into a package changed since $LAST_TAG; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Changed since $LAST_TAG:"
            echo "$CHANGED"
          fi

      - name: Get version to release
        id: semver
        if: steps.guard.outputs.skip != 'true'
        run: |
          CURRENT=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          UA="safegl-release-workflow (+https://github.com/viniciusmorgado/safegl)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -A "$UA" \
            "https://crates.io/api/v1/crates/$ANCHOR_CRATE/$CURRENT")
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "404" ]; then
            echo "Unexpected crates.io response: HTTP $STATUS" >&2
            exit 1
          fi
          if [ "$STATUS" = "404" ]; then
            VERSION="$CURRENT"
            echo "Cargo.toml is at $CURRENT, not yet on crates.io: releasing it."
          else
            LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
            RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"
            SUBJECTS=$(git log --format=%s "$RANGE" | grep -v '^chore: bump version' || true)
            if echo "$SUBJECTS" | grep -q '^BREAKING CHANGE:'; then
              BUMP=major
            elif echo "$SUBJECTS" | grep -q '^feat'; then
              BUMP=minor
            else
              BUMP=patch
            fi
            IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="$MAJOR.$MINOR.$PATCH"
            echo "Cargo.toml is at $CURRENT, already on crates.io: bumping ($BUMP) to $VERSION."
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update the package version
        if: steps.guard.outputs.skip != 'true'
        env:
          RELEASE_VERSION: ${{ steps.semver.outputs.version }}
        run: |
          TARGET_VERSION="$RELEASE_VERSION"
          CURRENT_VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$CURRENT_VERSION" = "$TARGET_VERSION" ]; then
            echo "Cargo.toml is already at version $TARGET_VERSION; skipping bump commit."
          else
            sed -i '0,/^version = ".*"/s//version = "'"$TARGET_VERSION"'"/' Cargo.toml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml
            # [skip ci], as in prepare-release.yml: no run for the bot's commit.
            git commit -m "chore: bump version to $TARGET_VERSION [skip ci]"
            git push
          fi

      - name: Publish to crates.io
        if: steps.guard.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ steps.semver.outputs.version }}
        run: |
          UA="safegl-release-workflow (+https://github.com/viniciusmorgado/safegl)"
          URL="https://crates.io/api/v1/crates/$ANCHOR_CRATE/$RELEASE_VERSION"
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -A "$UA" "$URL")
          case "$STATUS" in
            200) echo "$ANCHOR_CRATE $RELEASE_VERSION is already published; skipping." ;;
            404) cargo publish -p safegl ;;
            *) echo "Unexpected crates.io response: HTTP $STATUS" >&2; exit 1 ;;
          esac
          for _ in $(seq 1 30); do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -A "$UA" "$URL")
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          echo "Published version did not become visible on crates.io; no tag created." >&2
          exit 1

      - name: Create the tag
        if: steps.guard.outputs.skip != 'true'
        env:
          RELEASE_VERSION: ${{ steps.semver.outputs.version }}
        run: |
          TAG="v$RELEASE_VERSION"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "Tag $TAG already exists on origin; skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

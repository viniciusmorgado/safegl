name: ci

# Only changes to code or to the pipeline run CI. Docs, README, LICENSE, .gitignore, etc. don't.
on:
  push:
    branches: [ develop, main ]
    paths:
      - "src/**"
      - "build/**"
      - "tests/**"
      - "examples/**"
      - "benches/**"
      - "Cargo.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "build/**"
      - "tests/**"
      - "examples/**"
      - "benches/**"
      - "Cargo.toml"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit

      # without a level, the level is gl40
      - name: Check
        run: cargo check --all --all-targets

      - name: Compile the tests
        run: cargo test --all --all-targets --no-run

      # both chains at their highest levels compile the whole API
      - name: Check the highest levels
        run: cargo check --all --all-targets --features gl46,gles32

      - name: Compile the tests at the highest levels
        run: cargo test --all --all-targets --no-run --features gl46,gles32

      - name: Build the docs
        run: cargo doc --all --no-deps --features gl46,gles32

      # WebGL 2 and the browser example
      - name: Check the webgl level
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features webgl

      - name: Build the WebGL example
        run: cargo build --manifest-path examples/web/Cargo.toml --target wasm32-unknown-unknown

      # what each level compiles, for Linux, the browser and macOS
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the levels
        run: lua5.4 tests/levels/check_levels.lua

  mesa:
    name: Tests on Mesa (${{ matrix.name || matrix.level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mesa runs as OpenGL 4.0 and OpenGL ES 3.0 when told to
          - level: gl40
            env: MESA_GL_VERSION_OVERRIDE=4.0 MESA_GLSL_VERSION_OVERRIDE=400
          - level: gles30
            env: MESA_GLES_VERSION_OVERRIDE=3.0
          - level: gl46
            env: ""
          # the gl46 level on an OpenGL 4.0 driver: the runtime checks of the API above the driver
          - level: gl46
            name: gl46 on OpenGL 4.0
            cache: gl46-on-gl40
            env: SAFEGL_GL_VERSION='OpenGL 4.0' MESA_GL_VERSION_OVERRIDE=4.0 MESA_GLSL_VERSION_OVERRIDE=400
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_SHADER_CACHE_DISABLE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mesa-${{ matrix.cache || matrix.level }}

      # llvmpipe gives OpenGL 4.6 from Mesa 24; the PPA has a recent Mesa
      - name: Install Mesa
        run: |
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          sudo apt-get update
          sudo apt-get install -y mesa-utils libgl1-mesa-dri libegl1 libgles2 xvfb

      - name: Show the OpenGL version of llvmpipe
        run: |
          xvfb-run -a sh -c "glxinfo -B | grep -E 'renderer|version'"
          xvfb-run -a sh -c "env ${{ matrix.env }} glxinfo -B | grep -E 'core profile version|OpenGL ES profile version'"

      - name: Run the tests
        run: xvfb-run -a sh -c "env ${{ matrix.env }} cargo test --no-fail-fast --features ${{ matrix.level }}"

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --all --all-targets

      - name: Compile the tests
        run: cargo test --all --all-targets --no-run

  macos:
    name: macOS arm64
    runs-on: macos-latest
    env:
      BACKEND: glutin_backend,simple_window_builder,glutin/default,winit/rwh_06,glutin-winit/default
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The test harness runs the event loop off the main thread, which macOS doesn't allow,
      # so only the library and the examples are checked here. macOS stops at OpenGL 4.1, but
      # gl46 compiles there and fails when creating its context.
      - name: Check gl41
        run: cargo check --lib --examples --no-default-features --features gl41,$BACKEND

      - name: Check gl46
        run: cargo check --lib --examples --no-default-features --features gl46,$BACKEND

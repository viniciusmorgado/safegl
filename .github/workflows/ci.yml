name: ci

# Only changes to code or to the pipeline run CI. Docs, README, LICENSE, .gitignore, etc. don't.
on:
  push:
    branches: [ develop, main ]
    paths:
      - "src/**"
      - "build/**"
      - "tests/**"
      - "examples/**"
      - "benches/**"
      - "Cargo.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "build/**"
      - "tests/**"
      - "examples/**"
      - "benches/**"
      - "Cargo.toml"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit

      # without a level, the level is gl40
      - name: Check
        run: cargo check --all --all-targets

      - name: Compile the tests
        run: cargo test --all --all-targets --no-run

      # both chains at their highest levels compile the whole API
      - name: Check the highest levels
        run: cargo check --all --all-targets --features gl46,gles32

      - name: Compile the tests at the highest levels
        run: cargo test --all --all-targets --no-run --features gl46,gles32

      - name: Build the docs
        run: cargo doc --all --no-deps --features gl46,gles32

      # WebGL 2 and the browser example
      - name: Check the webgl level
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features webgl

      - name: Build the WebGL example
        run: cargo build --manifest-path examples/web/Cargo.toml --target wasm32-unknown-unknown

      # what each level compiles, for Linux, the browser and macOS
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the levels
        run: lua5.4 tests/levels/check_levels.lua

  mesa:
    name: Tests on Mesa (${{ matrix.name || matrix.level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mesa runs as OpenGL 4.0 and OpenGL ES 3.0 when told to
          - level: gl40
            env: MESA_GL_VERSION_OVERRIDE=4.0 MESA_GLSL_VERSION_OVERRIDE=400
          - level: gles30
            env: MESA_GLES_VERSION_OVERRIDE=3.0
          - level: gl46
            env: ""
          # the gl46 level on an OpenGL 4.0 driver: the runtime checks of the API above the driver
          - level: gl46
            name: gl46 on OpenGL 4.0
            cache: gl46-on-gl40
            env: SAFEGL_GL_VERSION='OpenGL 4.0' MESA_GL_VERSION_OVERRIDE=4.0 MESA_GLSL_VERSION_OVERRIDE=400
          # each OpenGL version from 4.1 to 4.5 at its level
          - level: gl41
            env: MESA_GL_VERSION_OVERRIDE=4.1 MESA_GLSL_VERSION_OVERRIDE=410
          - level: gl42
            env: MESA_GL_VERSION_OVERRIDE=4.2 MESA_GLSL_VERSION_OVERRIDE=420
          - level: gl43
            env: MESA_GL_VERSION_OVERRIDE=4.3 MESA_GLSL_VERSION_OVERRIDE=430
          - level: gl44
            env: MESA_GL_VERSION_OVERRIDE=4.4 MESA_GLSL_VERSION_OVERRIDE=440
          - level: gl45
            env: MESA_GL_VERSION_OVERRIDE=4.5 MESA_GLSL_VERSION_OVERRIDE=450
          # the gl46 level on an OpenGL 4.0 driver without any extension promoted after 4.0: the
          # errors and fallbacks of a driver that has neither the version nor the extension. Mesa
          # hides the extensions it can disable; SafeGL ignores all of them in debug builds.
          - level: gl46
            name: gl46 on a bare OpenGL 4.0
            cache: gl46-on-bare-gl40
            env: >-
              SAFEGL_GL_VERSION='OpenGL 4.0'
              MESA_GL_VERSION_OVERRIDE=4.0 MESA_GLSL_VERSION_OVERRIDE=400
              MESA_EXTENSION_OVERRIDE='-GL_ARB_shader_precision -GL_ARB_vertex_attrib_64bit
              -GL_ARB_viewport_array -GL_ARB_base_instance -GL_ARB_shading_language_420pack
              -GL_ARB_transform_feedback_instanced -GL_ARB_conservative_depth
              -GL_ARB_internalformat_query -GL_ARB_shader_atomic_counters
              -GL_ARB_shader_image_load_store -GL_EXT_shader_image_load_store
              -GL_ARB_shading_language_packing -GL_ARB_arrays_of_arrays -GL_ARB_ES3_compatibility
              -GL_ARB_compute_shader -GL_ARB_copy_image -GL_ARB_explicit_uniform_location
              -GL_ARB_fragment_layer_viewport -GL_ARB_framebuffer_no_attachments
              -GL_ARB_internalformat_query2 -GL_ARB_robust_buffer_access_behavior
              -GL_ARB_shader_image_size -GL_ARB_shader_storage_buffer_object
              -GL_ARB_stencil_texturing -GL_ARB_texture_buffer_range -GL_ARB_texture_query_levels
              -GL_ARB_texture_view -GL_ARB_buffer_storage -GL_ARB_enhanced_layouts
              -GL_ARB_query_buffer_object -GL_AMD_query_buffer_object
              -GL_ARB_texture_mirror_clamp_to_edge -GL_EXT_texture_mirror_clamp_to_edge
              -GL_ATI_texture_mirror_once -GL_EXT_texture_mirror_clamp -GL_ARB_texture_stencil8
              -GL_ARB_vertex_type_10f_11f_11f_rev -GL_ARB_clip_control
              -GL_ARB_conditional_render_inverted -GL_ARB_cull_distance -GL_ARB_derivative_control
              -GL_ARB_ES3_1_compatibility -GL_KHR_robustness -GL_ARB_shader_texture_image_samples
              -GL_ARB_texture_barrier -GL_NV_texture_barrier -GL_ARB_indirect_parameters
              -GL_ARB_pipeline_statistics_query -GL_ARB_polygon_offset_clamp
              -GL_EXT_polygon_offset_clamp -GL_ARB_shader_atomic_counter_ops -GL_ARB_gl_spirv
              -GL_ARB_spirv_extensions -GL_ARB_texture_filter_anisotropic
              -GL_EXT_texture_filter_anisotropic -GL_ARB_transform_feedback_overflow_query
              -GL_ARB_shader_draw_parameters -GL_ARB_shader_group_vote'
              SAFEGL_DISABLE_EXTENSIONS='GL_ARB_ES2_compatibility GL_ARB_get_program_binary
              GL_ARB_separate_shader_objects GL_ARB_shader_precision GL_ARB_vertex_attrib_64bit
              GL_ARB_viewport_array GL_ARB_base_instance GL_ARB_shading_language_420pack
              GL_ARB_transform_feedback_instanced GL_ARB_compressed_texture_pixel_storage
              GL_ARB_conservative_depth GL_ARB_internalformat_query GL_ARB_map_buffer_alignment
              GL_ARB_shader_atomic_counters GL_ARB_shader_image_load_store
              GL_EXT_shader_image_load_store GL_ARB_shading_language_packing GL_ARB_texture_storage
              GL_ARB_arrays_of_arrays GL_ARB_ES3_compatibility GL_ARB_clear_buffer_object
              GL_ARB_compute_shader GL_ARB_copy_image GL_KHR_debug GL_ARB_explicit_uniform_location
              GL_ARB_fragment_layer_viewport GL_ARB_framebuffer_no_attachments
              GL_ARB_internalformat_query2 GL_ARB_invalidate_subdata GL_ARB_multi_draw_indirect
              GL_ARB_program_interface_query GL_ARB_robust_buffer_access_behavior
              GL_ARB_shader_image_size GL_ARB_shader_storage_buffer_object GL_ARB_stencil_texturing
              GL_ARB_texture_buffer_range GL_ARB_texture_query_levels
              GL_ARB_texture_storage_multisample GL_ARB_texture_view GL_ARB_vertex_attrib_binding
              GL_ARB_buffer_storage GL_ARB_clear_texture GL_ARB_enhanced_layouts GL_ARB_multi_bind
              GL_ARB_query_buffer_object GL_AMD_query_buffer_object
              GL_ARB_texture_mirror_clamp_to_edge GL_EXT_texture_mirror_clamp_to_edge
              GL_ATI_texture_mirror_once GL_EXT_texture_mirror_clamp GL_ARB_texture_stencil8
              GL_ARB_vertex_type_10f_11f_11f_rev GL_ARB_clip_control
              GL_ARB_conditional_render_inverted GL_ARB_cull_distance GL_ARB_derivative_control
              GL_ARB_direct_state_access GL_ARB_ES3_1_compatibility GL_ARB_get_texture_sub_image
              GL_KHR_robustness GL_ARB_robustness GL_ARB_shader_texture_image_samples
              GL_ARB_texture_barrier GL_NV_texture_barrier GL_KHR_context_flush_control
              GL_ARB_indirect_parameters GL_ARB_pipeline_statistics_query
              GL_ARB_polygon_offset_clamp GL_EXT_polygon_offset_clamp
              GL_ARB_shader_atomic_counter_ops GL_ARB_gl_spirv GL_ARB_spirv_extensions
              GL_ARB_texture_filter_anisotropic GL_EXT_texture_filter_anisotropic
              GL_ARB_transform_feedback_overflow_query GL_ARB_shader_draw_parameters
              GL_ARB_shader_group_vote GL_KHR_no_error'
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_SHADER_CACHE_DISABLE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mesa-${{ matrix.cache || matrix.level }}

      # llvmpipe gives OpenGL 4.6 from Mesa 24; the PPA has a recent Mesa
      - name: Install Mesa
        run: |
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          sudo apt-get update
          sudo apt-get install -y mesa-utils libgl1-mesa-dri libegl1 libgles2 xvfb

      - name: Show the OpenGL version of llvmpipe
        run: |
          xvfb-run -a sh -c "glxinfo -B | grep -E 'renderer|version'"
          xvfb-run -a sh -c "env ${{ matrix.env }} glxinfo -B | grep -E 'core profile version|OpenGL ES profile version'"

      - name: Run the tests
        run: xvfb-run -a sh -c "env ${{ matrix.env }} cargo test --no-fail-fast --features ${{ matrix.level }}"

  firefox:
    name: Tests in Firefox (WebGL 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: firefox

      # the test runner must be the version of wasm-bindgen that the crate resolves to
      - name: Install the test runner of wasm-bindgen
        run: |
          cargo generate-lockfile
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked

      # the runner has no GPU: Firefox draws WebGL with Mesa's software driver, whose OpenGL and
      # EGL libraries the image may lack; `webdriver.json` lets Firefox use it for WebGL
      - name: Install Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri mesa-utils
          eglinfo -B || true

      # Firefox and geckodriver come with the runner image, which gives the directory of
      # geckodriver in the GECKOWEBDRIVER variable of the machine (not of the workflow, so the
      # shell reads it); the tests run headless
      - name: Run the tests in Firefox
        env:
          WASM_BINDGEN_TEST_TIMEOUT: "300"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          GECKODRIVER="${GECKOWEBDRIVER:+$GECKOWEBDRIVER/geckodriver}"
          if [ ! -x "$GECKODRIVER" ]; then GECKODRIVER="$(command -v geckodriver)"; fi
          echo "geckodriver: $GECKODRIVER ($("$GECKODRIVER" --version | head -1))"
          export GECKODRIVER
          cargo test --no-fail-fast --target wasm32-unknown-unknown --no-default-features --features webgl --tests

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --all --all-targets

      - name: Compile the tests
        run: cargo test --all --all-targets --no-run

  macos:
    name: macOS arm64
    runs-on: macos-latest
    env:
      BACKEND: glutin_backend,simple_window_builder,glutin/default,winit/rwh_06,glutin-winit/default
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The test harness runs the event loop off the main thread, which macOS doesn't allow,
      # so only the library and the examples are checked here. macOS stops at OpenGL 4.1, but
      # gl46 compiles there and fails when creating its context.
      - name: Check gl41
        run: cargo check --lib --examples --no-default-features --features gl41,$BACKEND

      - name: Check gl46
        run: cargo check --lib --examples --no-default-features --features gl46,$BACKEND
